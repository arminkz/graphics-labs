<circle cx="300" cy="240" r="5" fill="#EF9F27"/>
<text x="300" y="262" font-size="12" fill="#5f5e5a" text-anchor="middle">shiny floor pixel</text>
<text x="40" y="296" font-size="12" fill="#5f5e5a">Gray steps: the ray is still in front of the depth buffer, so keep marching.</text>
<text x="40" y="316" font-size="12" fill="#5f5e5a">Red step: the ray went behind the object's stored surface (within the thickness), so it's a hit.</text>
<text x="40" y="336" font-size="12" fill="#5f5e5a">Green ring: binary refinement walks back to the surface. That pixel's color becomes the reflection.</text>
