<polygon points="58,80 58,100 80,90" fill="#5F5E5A"/>
<text x="66" y="70" font-size="12" fill="#5f5e5a" text-anchor="middle">camera</text>
<line x1="82" y1="96" x2="296" y2="238" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
