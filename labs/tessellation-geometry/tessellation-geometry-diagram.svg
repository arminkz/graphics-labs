<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Pipeline stages from patches to pixels</title>
<desc>Six stages in order: patches in, tessellation control shader, tessellator, tessellation evaluation shader, geometry shader, rasterizer and fragment shader. The three shaders are programmable, the tessellator is fixed function.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="580" fill="#FFFFFF"/>
<g text-anchor="middle">
<rect x="200" y="40" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="63" font-size="14" font-weight="500" fill="#2C2C2A">Patches in</text>
<text x="340" y="82" font-size="12" fill="#5F5E5A">A few control points each</text>
<line x1="340" y1="96" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="124" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="147" font-size="14" font-weight="500" fill="#3C3489">Tessellation control shader</text>
<text x="340" y="166" font-size="12" fill="#534AB7">Per patch: chooses the levels</text>
<line x1="340" y1="180" x2="340" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="208" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="231" font-size="14" font-weight="500" fill="#085041">Tessellator</text>
<text x="340" y="250" font-size="12" fill="#0F6E56">Generates coordinates and triangles</text>
<line x1="340" y1="264" x2="340" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="292" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="315" font-size="14" font-weight="500" fill="#3C3489">Tessellation evaluation shader</text>
<text x="340" y="334" font-size="12" fill="#534AB7">Per new vertex: sets position</text>
<line x1="340" y1="348" x2="340" y2="370" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="376" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="340" y="399" font-size="14" font-weight="500" fill="#3C3489">Geometry shader</text>
<text x="340" y="418" font-size="12" fill="#534AB7">Per primitive: emits primitives</text>
<line x1="340" y1="432" x2="340" y2="454" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="460" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="483" font-size="14" font-weight="500" fill="#2C2C2A">Rasterizer and fragment shader</text>
<text x="340" y="502" font-size="12" fill="#5F5E5A">Per pixel: shades</text>
</g>
<rect x="200" y="542" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="222" y="553" font-size="12" fill="#444441">Shader you write</text>
<rect x="362" y="542" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="384" y="553" font-size="12" fill="#444441">Fixed function</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
