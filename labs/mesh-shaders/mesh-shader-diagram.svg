<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>How a meshlet refers to its triangles and vertices</title>
<desc>A meshlet record holds offsets and counts. It points into a list of meshlet triangles, which hold three small local indices each, and into a list of meshlet vertices, which map each local index to an index in the ordinary vertex buffer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="290" fill="#FFFFFF"/>
<g text-anchor="middle">
<rect x="40" y="110" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="115" y="133" font-size="14" font-weight="500" fill="#3C3489">Meshlet</text>
<text x="115" y="152" font-size="12" fill="#534AB7">Offsets and counts</text>

<rect x="250" y="50" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="345" y="73" font-size="14" font-weight="500" fill="#3C3489">Meshlet triangles</text>
<text x="345" y="92" font-size="12" fill="#534AB7">3 local indices each</text>

<rect x="250" y="170" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="345" y="193" font-size="14" font-weight="500" fill="#3C3489">Meshlet vertices</text>
<text x="345" y="212" font-size="12" fill="#534AB7">Local to global index</text>

<rect x="490" y="170" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="565" y="193" font-size="14" font-weight="500" fill="#2C2C2A">Vertex buffer</text>
<text x="565" y="212" font-size="12" fill="#5F5E5A">Positions, normals</text>
</g>
<path d="M190 128 L220 128 L220 78 L244 78" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M190 148 L220 148 L220 198 L244 198" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="345" y1="106" x2="345" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="198" x2="484" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="256" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="62" y="267" font-size="12" fill="#444441">Made by the meshlet builder</text>
<rect x="260" y="256" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="282" y="267" font-size="12" fill="#444441">The mesh's existing data</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
