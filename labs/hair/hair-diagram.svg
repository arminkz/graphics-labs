<rect width="680" height="300" fill="#ffffff"/>
<rect x="80" y="150" width="520" height="40" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<path d="M100 150l24-9M150 150l24-9M200 150l24-9M250 150l24-9M300 150l24-9M350 150l24-9M400 150l24-9M450 150l24-9M500 150l24-9M550 150l24-9" stroke="#854F0B" stroke-width="1" fill="none"/>
<text x="80" y="210" font-size="12" fill="#5f5e5a">root</text>
<text x="600" y="210" font-size="12" fill="#5f5e5a" text-anchor="end">tip</text>
<line x1="222" y1="42" x2="336" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="148" x2="458" y2="40" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="340" y1="148" x2="408" y2="42" stroke="#2C2C2A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="340" y1="148" x2="520" y2="66" stroke="#D85A30" stroke-width="2" marker-end="url(#arrow)"/>
<text x="214" y="38" font-size="12" fill="#5f5e5a" text-anchor="end">light</text>
<text x="398" y="32" font-size="12" fill="#5f5e5a" text-anchor="end">R: white</text>
<text x="466" y="36" font-size="12" fill="#5f5e5a">mirror direction</text>
<text x="528" y="64" font-size="12" fill="#5f5e5a">TRT: colored</text>
<text x="80" y="244" font-size="12" fill="#5f5e5a">The cuticle scales are tilted a few degrees, so R leaves rotated toward the root.</text>
<text x="80" y="264" font-size="12" fill="#5f5e5a">TRT bounces inside the fiber and leaves rotated toward the tip, tinted by pigment.</text>
<text x="80" y="284" font-size="12" fill="#5f5e5a">Seen across many strands, that gives two separate highlight bands.</text>
