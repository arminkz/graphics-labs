<text x="96" y="190" font-size="12" fill="#5f5e5a" text-anchor="middle">root</text>
<text x="584" y="190" font-size="12" fill="#5f5e5a" text-anchor="middle">tip</text>
<text x="40" y="220" font-size="12" fill="#5f5e5a">Dark dots: the strand's points. Each one is stored twice, at the same position.</text>
<text x="40" y="240" font-size="12" fill="#5f5e5a">Orange dots: where the vertex shader moves the two copies, half a width to each side.</text>
<text x="40" y="260" font-size="12" fill="#5f5e5a">Each segment becomes two triangles, and the ribbon narrows toward the tip.</text>
