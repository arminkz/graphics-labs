<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>The three baked textures of image-based lighting</title>
<desc>The environment map is baked into an irradiance map and a prefiltered map. A BRDF table is baked once and does not depend on the environment. A pixel reads all three and combines them into diffuse plus specular light.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="384" fill="#FFFFFF"/>
<g text-anchor="middle">
<rect x="127" y="40" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="237" y="63" font-size="14" font-weight="500" fill="#2C2C2A">Environment map</text>
<text x="237" y="82" font-size="12" fill="#5F5E5A">Light from every direction</text>

<rect x="40" y="150" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="135" y="173" font-size="14" font-weight="500" fill="#085041">Irradiance map</text>
<text x="135" y="192" font-size="12" fill="#0F6E56">Key: N</text>

<rect x="245" y="150" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="173" font-size="14" font-weight="500" fill="#085041">Prefiltered map</text>
<text x="340" y="192" font-size="12" fill="#0F6E56">Key: R, roughness</text>

<rect x="450" y="150" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="545" y="173" font-size="14" font-weight="500" fill="#3C3489">BRDF table</text>
<text x="545" y="192" font-size="12" fill="#534AB7">Key: N·V, roughness</text>

<rect x="230" y="270" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="293" font-size="14" font-weight="500" fill="#2C2C2A">Pixel color</text>
<text x="340" y="312" font-size="12" fill="#5F5E5A">Diffuse + specular</text>
</g>
<line x1="190" y1="96" x2="152" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="285" y1="96" x2="323" y2="144" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M135 206 L135 298 L224 298" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="206" x2="340" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M545 206 L545 298 L456 298" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="350" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="62" y="361" font-size="12" fill="#444441">Baked again for each environment</text>
<rect x="330" y="350" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="352" y="361" font-size="12" fill="#444441">Baked once, works for any environment</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
