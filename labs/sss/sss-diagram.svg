<text x="40" y="254" font-size="12" fill="#5f5e5a">Light enters at one point, wanders under the surface, and comes back out nearby.</text>
<text x="40" y="274" font-size="12" fill="#5f5e5a">Blue is absorbed quickly and barely moves; red travels farthest.</text>
<text x="40" y="294" font-size="12" fill="#5f5e5a">Screen-space SSS blurs the lit image with exactly this spread, separately per color.</text>
