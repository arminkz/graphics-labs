<svg xmlns="http://www.w3.org/2000/svg" width="680" height="190" viewBox="0 0 680 190" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="190" fill="#ffffff"/>
<g font-size="14" font-weight="500" text-anchor="middle">
<rect x="40" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="105" y="63" fill="#085041">Buffer A</text>
<rect x="200" y="40" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="265" y="63" fill="#712B13">Sim shader</text>
<rect x="360" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="425" y="63" fill="#085041">Buffer B</text>
<rect x="520" y="40" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="580" y="63" fill="#712B13">Draw shader</text>
</g>
<g font-size="12" text-anchor="middle">
<text x="105" y="83" fill="#0F6E56">state, this frame</text><text x="265" y="83" fill="#993C1D">move, age, respawn</text><text x="425" y="83" fill="#0F6E56">state, next frame</text><text x="580" y="83" fill="#993C1D">one quad each</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5">
<line x1="172" y1="68" x2="196" y2="68" marker-end="url(#arrow)"/><line x1="332" y1="68" x2="356" y2="68" marker-end="url(#arrow)"/><line x1="492" y1="68" x2="516" y2="68" marker-end="url(#arrow)"/>
</g>
<text x="40" y="132" font-size="12" fill="#5f5e5a">Transform feedback captures the sim shader's outputs into buffer B. Nothing is drawn in that pass.</text>
<text x="40" y="152" font-size="12" fill="#5f5e5a">Next frame the roles swap: B is read, A is written.</text>
<text x="40" y="172" font-size="12" fill="#5f5e5a">The particle data never leaves the GPU.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
