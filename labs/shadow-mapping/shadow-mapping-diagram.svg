<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="680" height="360" fill="#ffffff"/>
<text x="500" y="32" font-size="12" fill="#5f5e5a" text-anchor="middle">Parallel rays from the sun</text>
<line x1="40" y1="250" x2="640" y2="250" stroke="#888780" stroke-width="1"/>
<rect x="300" y="170" width="60" height="80" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="214" font-size="12" fill="#444441" text-anchor="middle">box</text>
<line x1="600" y1="50" x2="450" y2="250" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
<line x1="400" y1="50" x2="310" y2="170" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
<line x1="310" y1="170" x2="250" y2="250" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="310" cy="170" r="5" fill="#EF9F27"/>
<text x="294" y="160" font-size="12" fill="#5f5e5a" text-anchor="end">first hit = stored depth</text>
<circle cx="450" cy="250" r="6" fill="#639922"/>
<circle cx="250" cy="250" r="6" fill="#E24B4A"/>
<text x="450" y="278" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">A: lit</text>
<text x="450" y="296" font-size="12" fill="#5f5e5a" text-anchor="middle">my depth ≈ stored depth</text>
<text x="250" y="278" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">B: in shadow</text>
<text x="250" y="296" font-size="12" fill="#5f5e5a" text-anchor="middle">my depth &gt; stored depth</text>
<text x="40" y="326" font-size="12" fill="#5f5e5a">Shadow map texel = distance from the sun to the first surface along that ray.</text>
<text x="40" y="346" font-size="12" fill="#5f5e5a">Each pixel compares its own distance from the sun with that stored value.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
